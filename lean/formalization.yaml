# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# OPAC-012 project card, v0.4.
# This file describes the Lean formalization contained in the `lean/`
# subdirectory of https://github.com/pseudoeffective/opac012.
#
# The surrounding repository also contains the mathematical paper,
# supplementary computations, and prompting transcripts.

version: "v0.4"

project:
  name: "OPAC-012: coefficientwise positivity for alternating sums of q-factorials"
  description: >-
    A Lean 4 formalization of the Lewis–Morales OPAC-012 conjecture and a
    stronger sharp-range theorem. For k ≤ m, the alternating q-factorial sum
    S_{k,m} has nonnegative integer coefficients when 2k ≤ m+1. For k ≥ 3,
    it has a negative coefficient when k ≤ m ≤ 2k−2. In particular,
    S_{n,2n} is coefficientwise nonnegative for every natural n.

  # The code was produced by Codex under user direction. 
  authors:
    - "OpenAI Codex"
  responsible_maintainers: [David Anderson]
  license: "0BSD"

sources:
  - title: "Coefficientwise positivity for alternating sums of q-factorials"
    type: "other"
    id: "opac012-research-note.tex (September 9, 2026; supplied project source)"
    location: "Theorem 1.1 and Sections 2–4"
    relationship: "formalizes"
    note: >-
      The supplied, unsigned research note gives the stronger stable-range
      positivity theorem, its sharpness assertion, and the proof using a
      universal Gaussian-binomial expansion. Bibliographic authorship and
      source license were not stated in the supplied TeX.
  - title: "Rook theory of the finite general linear group"
    authors: ["J. B. Lewis", "A. H. Morales"]
    type: "article"
    id: "arXiv:1707.08192"
    location: "Conjecture 6.8"
    relationship: "background"
    note: >-
      Original conjecture for the diagonal family S_{n,2n}, as cited in
      the supplied research note; Experiment. Math. 29 (2020), no. 3,
      328–346.

  - title: "OPAC-012"
    authors: []
    contributors:
      - name: "Open Problems in Algebraic Combinatorics"
        role: "problem source"
      - name: "Lewis and Morales"
        role: "conjecture origin"
    id: "https://realopacblog.wordpress.com/"
    type: "web post"
    relationship: "background"
    note: >-
      OPAC-012 is based on positivity conjectures originating in work of
      Lewis and Morales.

  - title: "Solution of OPAC-012"
    authors:
      - "David Anderson"
    id: "https://github.com/pseudoeffective/opac012"
    type: "article"
    location: "solution/opac012-solution.pdf"
    relationship: "formalizes"
    note: >-
      This is the accompanying human-readable proof whose main argument
      is formalized by the Lean development.



classification:
  arxiv: ["math.CO"]

status:
  scope: >-
    Complete polynomial positivity and sharpness statements for natural
    indices in the stated ranges. Includes the normalization identity,
    universal expansion, and coefficientwise domination proof. The
    finite-field matrix-counting interpretation in Section 5 of the
    source note is outside this Lean development.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "OPAC012.S_coeffNonneg"
      file: "OPAC012/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "OPAC012.opac012_coeffNonneg"
      file: "OPAC012/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "OPAC012.exists_neg_coeff_of_below_threshold"
      file: "OPAC012/Sharpness.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["GPT-6"]
      framework: "OpenAI Codex in ChatGPT Work"
      tool_setup: >-
        Iterative Lean 4/Lake elaboration and Mathlib source inspection.
        Lean is pinned to v4.34.1; Mathlib is pinned to v4.34.1 in the
        Lake configuration and to a concrete revision in lake-manifest.json.
        The final work session used GPT-6; model provenance for earlier
        passes was not independently reconstructed.
      prompting_notes: >-
        The user supplied a proof note and an autoformalization handoff,
        directed completion of the Lean formalization, and requested
        continued work through the sharpness theorem.
  notes: >-
    The agent wrote and checked the Lean proof interactively. A complete
    Lake build succeeded, a search found no sorry/admit in the project
    sources, and #print axioms for the principal results showed only the
    three standard axioms listed above. Monetary cost and total wall time
    were not recorded.

fidelity:
  divergences: >-
    The source states the result for integer parameters 0 ≤ k ≤ m; Lean
    uses natural indices with k ≤ m and expresses m ≥ 2k−1 as 2k ≤ m+1
    to avoid truncated subtraction. The diagonal corollary is proved for
    n = 0 as well as the source's n ≥ 1. The polynomial proof follows
    the source's normalization, Gaussian-basis expansion, and domination
    argument. Section 5's matrix-counting interpretation and the
    identification with the reduced matrix count are not formalized.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Kernel checking, whole-project build, placeholder search, and axiom
    audit were performed by the agent. No independent human review of
    statement fidelity or proof correspondence is recorded here.

alignment:
  namespace: "OPAC012"
  statements:
    - source: "Definition of S_{k,m} in Theorem 1.1"
      lean: "OPAC012.S"
      module: "OPAC012.Normalization"
      status: "formalized"
      note: "An integer polynomial, with ordinary binomial coefficients."
    - source: "Normalization S_{k,m} = [m-k]! F_k(m-k), equation (3)"
      lean: "OPAC012.S_eq_qFact_mul_F"
      module: "OPAC012.Normalization"
      status: "proved"
    - source: "Universal Gaussian-binomial expansion, Section 2"
      lean: "OPAC012.universal_expansion"
      module: "OPAC012.UniversalExpansion"
      status: "proved"
    - source: "Positivity of the universal coefficients, Section 3"
      lean: "OPAC012.theta_coeffNonneg"
      module: "OPAC012.Domination"
      status: "proved"
    - source: "Theorem 1.1, stable-range positivity"
      lean: "OPAC012.S_coeffNonneg"
      module: "OPAC012.Main"
      status: "proved"
    - source: "Lewis–Morales Conjecture 6.8 / OPAC-012"
      lean: "OPAC012.opac012_coeffNonneg"
      module: "OPAC012.Main"
      status: "proved"
    - source: "Theorem 1.1, sharpness for k ≥ 3"
      lean: "OPAC012.exists_neg_coeff_of_below_threshold"
      module: "OPAC012.Sharpness"
      status: "proved"
    - source: "Section 5, finite-field matrix-counting interpretation"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "The algebraic positivity statement is formalized; the external counting identity is not."
